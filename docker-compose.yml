services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_groove
      POSTGRES_USER: career_groove
      POSTGRES_PASSWORD: career_groove
    volumes:
      - career_groove_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_groove -d career_groove"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - career_groove_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://career_groove:career_groove@db:5432/career_groove
      OLLAMA_BASE_URL: ${CAREER_GROOVE_OLLAMA_BASE_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  document-worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: ["node", "scripts/document-worker.mjs"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://career_groove:career_groove@db:5432/career_groove
      OLLAMA_BASE_URL: ${CAREER_GROOVE_OLLAMA_BASE_URL:-http://ollama:11434}
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  mobile-notification-worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ["node", "scripts/mobile-notification-worker.mjs"]
    env_file: [.env]
    environment:
      MOBILE_NOTIFICATION_ENDPOINT: http://app:3000/api/internal/mobile-notifications
    depends_on:
      - app
  follow-up-worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ["node", "scripts/follow-up-worker.mjs"]
    env_file: [.env]
    environment:
      FOLLOW_UP_WORKER_ENDPOINT: http://app:3000/api/internal/follow-up-worker
      FOLLOW_UP_WORKER_INTERVAL_MS: 3600000
      REDIS_URL: redis://redis:6379
    depends_on:
      - app
      - redis
  backup-scheduler:
    build:
      context: .
      target: backup-scheduler
    restart: unless-stopped
    user: "${CAREER_GROOVE_BACKUP_UID:-1000}:${CAREER_GROOVE_BACKUP_GID:-1000}"
    working_dir: /workspace
    command: ["node", "scripts/backup/scheduler.mjs"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://career_groove:career_groove@db:5432/career_groove
      CAREER_GROOVE_BACKUP_ROOT: /workspace/backups
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - .:/workspace
    depends_on:
      db: { condition: service_healthy }
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${OLLAMA_MODELS_DIR:-./.ollama}:/root/.ollama
volumes:
  career_groove_data:
  career_groove_redis:
