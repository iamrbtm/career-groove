x-ollama-hosts: &ollama-hosts
  - "host.docker.internal:host-gateway"
  - "ollama:host-gateway"

services:
  app:
    build:
      context: .
      target: all-in-one
    image: career_groove:all-in-one
    restart: unless-stopped
    container_name: career_groove
    ports:
      - "3000:3000"
      - "5432:5432"
      - "6379:6379"
    env_file: [.env]
    environment:
      REDIS_URL: redis://127.0.0.1:6379
      OLLAMA_BASE_URL: ${CAREER_GROOVE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MOBILE_NOTIFICATION_ENDPOINT: http://127.0.0.1:3000/api/internal/mobile-notifications
      FOLLOW_UP_WORKER_ENDPOINT: http://127.0.0.1:3000/api/internal/follow-up-worker
      FOLLOW_UP_WORKER_INTERVAL_MS: 3600000
      CAREER_GROOVE_BACKUP_ROOT: /app/backups
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts: *ollama-hosts
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./backups:/app/backups
      - career_groove_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  career_groove_redis:
