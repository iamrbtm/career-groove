name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: |
          curl --fail --location --output /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test
        working-directory: ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r \
            '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$DEVICE_ID"
          xcodebuild test \
            -project CareerGroove.xcodeproj \
            -scheme CareerGroove \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
