name: CareerGroove
options:
  bundleIdPrefix: com.careergroove
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
targets:
  CareerGroove:
    type: application
    platform: iOS
    sources:
      - path: CareerGroove
        excludes:
          - Resources
    resources:
      - path: CareerGroove/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careergroove.careergroove
        PRODUCT_NAME: Career Groove
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CareerGroove.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          API_BASE_URL: https://careergroove.website
          APS_ENVIRONMENT: development
        Release:
          API_BASE_URL: https://careergroove.website
          APS_ENVIRONMENT: production
    scheme:
      storeKitConfiguration: Config/Products.storekit
      testTargets:
        - CareerGrooveTests
      gatherCoverageData: true
  CareerGrooveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CareerGrooveTests
    dependencies:
      - target: CareerGroove
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.careergroove.careergroove.tests
        GENERATE_INFOPLIST_FILE: YES
