[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:postgres]
command=postgres -D %(ENV_PGDATA)s
user=postgres
priority=10
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=redis-server --dir /data --appendonly yes --appendfsync everysec
user=redis
priority=10
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:db-init]
command=/bin/sh /app/deploy/db-init.sh
priority=20
autostart=true
autorestart=false
startretries=3
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:server]
command=/bin/sh /app/deploy/after-db.sh node server.js
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:document-worker]
command=/bin/sh /app/deploy/after-db.sh node scripts/document-worker.mjs
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mobile-notification-worker]
command=/bin/sh /app/deploy/after-db.sh node scripts/mobile-notification-worker.mjs
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:follow-up-worker]
command=/bin/sh /app/deploy/after-db.sh node scripts/follow-up-worker.mjs
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:backup-scheduler]
command=/bin/sh /app/deploy/after-db.sh node scripts/backup/scheduler.mjs
user=node
priority=30
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
